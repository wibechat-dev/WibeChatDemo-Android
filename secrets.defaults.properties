# ---------------------------------------------------------------------------
# Placeholder values, safe to commit and share.
#
# Copy this file to `secrets.properties` (same folder) and put the real values
# there. `secrets.properties` is git-ignored and overrides every key below.
# ---------------------------------------------------------------------------

# Base URL of the deployed Firebase Cloud Functions (no trailing slash).
# The app calls:
#   GET  <base>/wibechatToken/api/wibechat-token?room=<roomId>
#   POST <base>/sendNotification/api/send-notification
WIBECHAT_FUNCTIONS_BASE_URL=https://REGION-YOUR_FIREBASE_PROJECT.cloudfunctions.net

# Named Firestore database the app reads and writes.
FIRESTORE_DATABASE_ID=(default)

# OAuth 2.0 *Web* client ID from the Firebase project (Authentication >
# Sign-in method > Google > Web SDK configuration). Leave empty to disable the
# "Google" sign-in button; email/password sign-in still works.
GOOGLE_WEB_CLIENT_ID=
